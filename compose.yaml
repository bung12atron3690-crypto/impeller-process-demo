name: impeller-demo
services:
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    mem_limit: 768m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    ports:
      - "${DEMO_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./models/samples:/srv/samples:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
