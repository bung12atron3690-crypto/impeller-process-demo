limit_req_zone $binary_remote_addr zone=analysis_rate:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=general_rate:10m rate=20r/s;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;

    location = /api/analyze {
        limit_req zone=analysis_rate burst=2 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        limit_req zone=general_rate burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /samples/ {
        alias /srv/samples/;
        autoindex off;
    }
    location / {
        limit_req zone=general_rate burst=30 nodelay;
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
